[project]
name = "salvo"
version = "0.1.0"
description = "Spectator-first Battleship arena"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.125.0",
    "fastapi>=0.115",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[project.scripts]
salvo = "salvo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["salvo"]
force-include = { "salvo/agents/prompts" = "salvo/agents/prompts" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
